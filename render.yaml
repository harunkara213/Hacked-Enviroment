services:
  - type: web
    name: hacker-environment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DONATION_DEMO
        value: "1"
      - key: PYTHON_VERSION
        value: 3.13.5
      # The web server's disk is wiped on every deploy/sleep, so all data lives in Postgres.
      - key: DATABASE_URL
        fromDatabase:
          name: hacker-environment-db
          property: connectionString

databases:
  - name: hacker-environment-db
    plan: free
    databaseName: hackerenv
    user: hackerenv
